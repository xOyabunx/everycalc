# Wrangler config for the `everycalc` Cloudflare Worker.
#
# This worker serves the static site AND the JSON API from one domain:
#   - any path starting with /api/  -> handled by src/index.js
#   - everything else               -> served from static assets
#
# Before deploying, set `directory` below to the absolute path of your
# static-site build (the folder containing index.html, css/, js/, etc.).

name = "everycalc"
compatibility_date = "2026-09-29"
main = "src/index.js"

[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
